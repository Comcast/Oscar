name: Security
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - name: Compile for Java analysis
        if: matrix.language == 'java-kotlin'
        run: mvn -B -DskipTests compile
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve runtime JARs and record dependency tree
        run: |
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/security-dependencies
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputFile=target/security-dependency-tree.txt
      - name: Scan resolved JARs (block high and critical)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: target/security-dependencies
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: dependency-vulnerabilities.json
      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-reports
          path: |
            dependency-vulnerabilities.json
            target/security-dependency-tree.txt
          if-no-files-found: warn
  dependency-graph:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5
        with:
          maven-args: -B
