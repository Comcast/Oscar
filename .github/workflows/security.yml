name: Security
on:
  push:
    branches: [master]
    paths:
      - '**/pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'install.sh'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'build.xml'
      - 'lib/**'
  pull_request:
    paths:
      - '**/pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'mvnw.cmd'
      - 'install.sh'
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'build.xml'
      - 'lib/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve runtime JARs and record dependency tree
        run: |
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/security-dependencies
          mvn -B org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputFile=target/security-dependency-tree.txt
      - name: Scan resolved JARs (block high and critical)
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          path: target/security-dependencies
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: dependency-vulnerabilities.json
      - name: Preserve security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-reports
          path: |
            dependency-vulnerabilities.json
            target/security-dependency-tree.txt
          if-no-files-found: warn
  dependency-graph:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5
        with:
          maven-args: -B
