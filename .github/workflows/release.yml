name: Release Binary

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload assets to (example: v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  security:
    name: Validate release security
    permissions:
      contents: write
      security-events: write
      actions: read
    uses: ./.github/workflows/security.yml
    with:
      checkout-ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
  build-and-upload:
    needs: security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Maven cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build thin and all JARs
        run: |
          mvn -B -DskipTests clean package
          all_jar="$(find target -maxdepth 1 -type f -name 'oscar-*-all.jar')"
          thin_jar="$(find target -maxdepth 1 -type f -name 'oscar-*.jar' ! -name '*-all.jar')"
          if [[ ! -f "${all_jar}" || ! -f "${thin_jar}" ]]; then
            echo "Expected exactly one thin JAR and one all JAR in target/." >&2
            exit 1
          fi
          for source_jar in "${thin_jar}" "${all_jar}"; do
            if jar tf "${source_jar}" | grep -E '^com/comcast/oscar/(examples|test)/|^test/'; then
              echo "Release JAR contains Oscar examples or tests: ${source_jar}" >&2
              exit 1
            fi
          done
          cp "${thin_jar}" oscar-thin.jar
          cp "${all_jar}" oscar-all.jar
          cp oscar-all.jar oscar.jar

      - name: Generate checksums
        run: |
          for artifact in oscar.jar oscar-all.jar oscar-thin.jar; do
            sha256sum "${artifact}" > "${artifact}.sha256"
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.event.release.tag_name }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            oscar.jar
            oscar.jar.sha256
            oscar-all.jar
            oscar-all.jar.sha256
            oscar-thin.jar
            oscar-thin.jar.sha256
