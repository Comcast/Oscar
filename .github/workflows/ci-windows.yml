name: CI Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: CodeQL
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
  build-windows:
    name: Java 21 / Windows 11 ARM (x64 emulation)
    needs: security
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
          cache: maven
      - name: Build JARs and run JUnit tests
        shell: pwsh
        run: mvn -B clean verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-windows-11-arm
          path: target/surefire-reports/
          if-no-files-found: warn
